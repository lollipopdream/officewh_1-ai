<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background with subtle dark gradient -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A" />
  <rect width="64" height="64" rx="16" stroke="rgba(10, 255, 224, 0.4)" stroke-width="2" />
  
  <!-- Stylized Mountain Peaks -->
  <!-- Back Ridge (Darker Cyan) -->
  <polygon points="12,48 30,22 42,48" fill="#005B66" opacity="0.6" />
  
  <!-- Main Mt. Takao Peak (Bright Salomon Cyan to Teal Gradient) -->
  <defs>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0AFFE0" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="ridgeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#0AFFE0" />
    </linearGradient>
  </defs>

  <polygon points="22,48 38,14 54,48" fill="url(#peakGrad)" />
  <!-- Mountain Light Facet -->
  <polygon points="38,14 38,48 54,48" fill="#0AFFE0" opacity="0.85" />
  <polygon points="22,48 38,14 38,48" fill="url(#ridgeLight)" opacity="0.95" />

  <!-- Salomon Red Summit Beacon Dot -->
  <circle cx="38" cy="14" r="3.5" fill="#E8002D" />
  <circle cx="38" cy="14" r="5" stroke="#E8002D" stroke-width="1" opacity="0.6" />
</svg>
